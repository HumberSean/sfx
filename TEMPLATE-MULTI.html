<!--VOLUME BAR TEMPLATE
<template id="volumeTemplate">
	<style>
.sfx_controls {
	display: inline-block;
	width: 100%;
	position: relative;
	margin:0;
}
/* SLIDER STYLING BASED ON
https://blog.logrocket.com/creating-custom-css-range-slider-javascript-upgrades
*/
.sfx_text input{
								float:right;
								width: 25%;
								height: 25px;
							}


							input[type="range"]{
								-webkit-appearance: none;
								appearance: none;
								cursor: pointer;
								outline: none;
								width: 100%;
								height: 22px;
								background: #ccc;
								border-radius: 16px;
								overflow: hidden;
								margin-top: 6%;	
							}
							input[type="range"]::-webkit-slider-runnable-track{
								height: 22px;
								background: #ccc;
								border-radius: 16px;
							}
							input[type="range"]::-webkit-slider-thumb{
								-webkit-appearance: none;
								appearance: none;
								height: 22px;
								width: 30px;
								background-color: #000;
								border-radius: 8px;
								/* border-radius: 50%; */
								border: 2px solid #CCC;

								box-shadow: -407px 0 0 400px rgb(49, 246, 39);
							}

.controls__labels {
	display:inline-flex;
	justify-content: space-between;
	/* justify-content: flex-start; */
	/* padding: 0 10px; */
	width: 90%;
	/* float: right; */
	position: absolute;
	top: 2px;
	left: 6%;
}
.controls__labels span{
	display: flex;
	height: 10px;
	font-weight: bold;
	font-size: 0.75em;
	color: #c70505;
}
	</style>
	<p class="sfx_controls">
		<input type="range" min="0" max="1" value="1" step="0.1">
		<span class="controls__labels">
			<span>0</span>
			<span>1</span>
			<span>2</span>
			<span>3</span>
			<span>4</span>
			<span>5</span>
			<span>6</span>
			<span>7</span>
			<span>8</span>
			<span>9</span>
			<span>10</span>
		</span>
	</p>
</template>
